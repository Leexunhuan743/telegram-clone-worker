name: Sync Upstream & Auto Deploy

on:
  schedule:
    # Runs every 3 days at 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force build and deploy even if no new upstream commits'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for Upstream Commits & Sync
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add upstream remote
          git remote add upstream https://github.com/iamLiquidX/telegram-clone-worker.git || true
          git fetch upstream main

          # Count new commits from upstream compared to our branch
          NEW_COMMITS=$(git rev-list HEAD..upstream/main --count)
          echo "Found $NEW_COMMITS new commit(s) from upstream."

          FORCE_DEPLOY="${{ github.event.inputs.force_deploy }}"

          if [ "$NEW_COMMITS" -gt 0 ]; then
            echo "Merging upstream changes..."
            git merge upstream/main --no-edit -m "chore(sync): auto-sync upstream changes"
            git push origin main
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "$FORCE_DEPLOY" = "true" ]; then
            echo "No new commits, but force_deploy is requested."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new commits from upstream. Nothing to deploy."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.sync.outputs.should_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        if: steps.sync.outputs.should_deploy == 'true'
        run: npm ci

      - name: Build and Deploy to Cloudflare Workers
        if: steps.sync.outputs.should_deploy == 'true'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
